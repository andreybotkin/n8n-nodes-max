name: Finalize MAX security hardening

on:
  push:
    branches:
      - security/harden-max-node
    paths:
      - .github/workflows/apply-security-hardening.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: security/harden-max-node
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Format changed sources
        run: npx prettier --write nodes/Max/SecurityUtils.ts nodes/Max/SecureMax.node.ts nodes/Max/SecureMaxTrigger.node.ts credentials/SecureMaxApi.credentials.ts package.json package-lock.json

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build package
        run: npm run build

      - name: Verify patch formatting
        run: git diff --check

      - name: Remove one-shot migration files
        run: |
          rm -f scripts/apply-security-hardening.py
          rm -f .github/workflows/apply-security-hardening.yml
          rmdir scripts 2>/dev/null || true

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize hardened MAX node build"
          git push origin HEAD:security/harden-max-node
