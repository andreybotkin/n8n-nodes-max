name: Apply MAX security hardening

on:
  push:
    branches:
      - security/harden-max-node
    paths:
      - scripts/apply-security-hardening.py
      - .github/workflows/apply-security-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: security/harden-max-node
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Apply hardening migration
        run: python scripts/apply-security-hardening.py

      - name: Update dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format sources
        run: npm run format:all

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build package
        run: npm run build

      - name: Verify clean patches
        run: git diff --check

      - name: Remove one-shot migration files
        run: |
          rm -f scripts/apply-security-hardening.py
          rm -f .github/workflows/apply-security-hardening.yml
          rmdir scripts 2>/dev/null || true

      - name: Commit hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden MAX credentials, webhooks and attachments"
          git push origin HEAD:security/harden-max-node
