name: Build n8n image with MAX node

on:
  workflow_dispatch:
    inputs:
      n8n_version:
        description: Exact n8n image tag to use as the base image
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.n8n
          push: true
          platforms: linux/amd64
          build-args: |
            N8N_VERSION=${{ inputs.n8n_version }}
          tags: |
            ghcr.io/andreybotkin/n8n-with-max:${{ inputs.n8n_version }}-${{ github.sha }}
            ghcr.io/andreybotkin/n8n-with-max:${{ inputs.n8n_version }}-latest
