name: Build n8n image with MAX node

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-n8n-image.yml
      - .dockerignore
      - Dockerfile.n8n
      - package.json
      - package-lock.json
      - credentials/**
      - nodes/**
      - gulpfile.js
      - tsconfig.json
  workflow_dispatch:
    inputs:
      n8n_version:
        description: Exact n8n image tag. Leave empty to use the current official latest image.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve n8n version
        id: n8n
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.n8n_version }}
        run: |
          set -euo pipefail

          version="${REQUESTED_VERSION:-}"
          if [ -z "$version" ]; then
            docker pull n8nio/n8n:latest >/dev/null
            version="$(docker run --rm --entrypoint n8n n8nio/n8n:latest --version | tr -d '\r' | tail -n 1)"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unable to resolve a valid n8n version: $version" >&2
            exit 1
          fi

          docker buildx imagetools inspect "n8nio/n8n:$version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using n8n version $version"

      - name: Generate image tags
        id: tags
        shell: bash
        env:
          N8N_VERSION: ${{ steps.n8n.outputs.version }}
        run: |
          set -euo pipefail

          tags="ghcr.io/andreybotkin/n8n-with-max:${N8N_VERSION}-latest
          ghcr.io/andreybotkin/n8n-with-max:latest"

          {
            echo 'value<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.n8n
          push: true
          platforms: linux/amd64
          build-args: |
            N8N_VERSION=${{ steps.n8n.outputs.version }}
          tags: ${{ steps.tags.outputs.value }}
